[project]
name = "autoreport"
version = "0.1.0"
description = "AutoReport 多智能体自动研报系统：基于 LangChain/LangGraph/LangSmith 的 A 股研报采集、检索与报告生成"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # LLM 编排三件套
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "langsmith>=0.1",
    # 向量库（本地起步）
    "chromadb>=1.0",
    # PDF 解析
    "pymupdf>=1.25",
    # 存储
    "sqlalchemy>=2.0",
    # HTTP 采集
    "requests>=2.31",
    # 中文分词（关键词检索用）
    "jieba>=0.42",
    # 配置
    "pydantic-settings>=2.0",
    # CLI / 展示
    "typer>=0.12",
    "rich>=13.0",
    # Web Demo
    "streamlit>=1.40",
]

[project.optional-dependencies]
# 本地嵌入模型兜底（不需要 API Key，但体积较大）
local-embedding = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
autoreport = "autoreport.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoreport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
